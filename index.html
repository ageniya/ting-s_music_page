<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TING · 婚礼音乐库</title>
    <meta name="theme-color" content="#f6f2e9">
    <link rel="stylesheet" href="css/style.css?v=20260920-ivory">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="music-page">
    <!-- 浮动音符（JS 动态生成） -->
    <div class="floating-notes"></div>

    <!-- 背景流动线条：只做装饰，不参与页面交互 -->

            <path class="ambient-ribbon" d="M790 -70 C1050 40 1050 256 1290 232 S1450 188 1530 312"/>
            <path class="ambient-ribbon ribbon-fine" d="M830 -80 C1060 44 1065 278 1300 251 S1470 217 1530 341"/>
            <path class="ambient-ribbon ribbon-fine" d="M900 -90 C1070 24 1125 220 1310 206 S1470 162 1540 266"/>
        </g>
        <g class="ribbon-drift ribbon-drift-bottom">
            <path class="ribbon-wash" d="M-90 550 C80 568 10 780 250 831 S422 887 520 980 L-90 980Z"/>
            <path class="ribbon-jade" d="M-90 750 C32 772 120 878 264 911 L-90 980Z"/>
            <path class="ambient-ribbon" d="M-70 508 C103 574 23 752 262 801 S432 906 602 950"/>
            <path class="ambient-ribbon ribbon-fine" d="M-80 538 C85 587 8 778 250 820 S440 930 580 970"/>
            <path class="ambient-ribbon ribbon-fine" d="M-70 597 C60 656 40 794 255 847 S421 946 560 991"/>
        </g>
    </svg>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-left">
            <img src="images/logo-dark.png" alt="TING" class="header-logo">
            <span class="subtitle">婚礼音乐库<span class="subtitle-detail">收藏音乐 · 编排仪式</span></span>
        </div>
        <div class="header-right">
            <button class="btn btn-outline btn-utility" id="btnRandomSong" type="button" title="从曲库随机试听一首">
                ♬ 随机一首
            </button>
            <button class="btn btn-outline btn-utility is-active" id="btnAmbient" type="button" title="动态氛围" aria-pressed="true">
                ✦ 动态氛围
            </button>
            <button class="btn btn-primary" id="btnUpload" title="上传 MP3 文件">
                <span aria-hidden="true">↑</span> 上传 MP3
            </button>
            <button class="btn btn-outline" id="btnExportZip" title="导出歌单为 ZIP 压缩包">
                <span aria-hidden="true">↓</span> 导出 ZIP
            </button>
        </div>
        <!-- 隐藏的文件上传 input -->
        <input type="file" id="fileUploadMp3" accept=".mp3" multiple style="display:none">
    </header>

    <section class="atelier-strip" aria-label="婚礼音乐编排控制台">
        <div class="atelier-intro">
            <p class="atelier-kicker">为重要的日子，留一段旋律</p>
            <h1>让每一刻，都有回响。</h1>
        </div>
        <div class="atelier-stats">
            <div class="atelier-stat">
                <span>珍藏音乐</span>
                <strong id="atelierLibraryStat">0</strong><em>首</em>
            </div>
            <div class="atelier-stat">
                <span>正在编排</span>
                <strong id="atelierWorkspaceStat">0</strong><em>首</em>
            </div>
            <div class="atelier-stat atelier-duration">
                <span>歌单时长</span>
                <strong id="atelierDurationStat">0:00</strong>
            </div>
        </div>
        <div class="atelier-actions">
            <div class="atelier-live" title="页面正在运行">
                <span class="atelier-live-dot"></span>
                <span id="atelierClock">--:--</span>
                <span class="atelier-live-label">实时</span>
                <span class="atelier-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            </div>
            <button class="atelier-action" id="btnToggleFolders" type="button">折叠曲库</button>
            <button class="atelier-action atelier-action-primary" id="btnFocusWorkspace" type="button">进入工作区 →</button>
        </div>
    </section>

    <!-- 主体布局 -->
    <div class="main-container">
        <!-- 左侧：音乐库 -->
        <aside class="panel panel-library active" id="panelLibrary">
            <div class="panel-header">
                <h2><span class="section-index">01</span>音乐库</h2>
                <span class="song-count" id="libraryCount">0 首</span>
            </div>

            <!-- 搜索 -->
            <div class="search-box">
                <input type="search" id="searchInput" placeholder="搜索歌曲关键词…" aria-label="搜索歌曲关键词">
            </div>

            <!-- 文件夹树 -->
            <div class="song-list folder-tree" id="libraryList">
                <div class="empty-state">
                    <div class="empty-icon">🎶</div>
                    <p>还没有歌曲</p>
                </div>
            </div>
            <div class="library-contact">没有你想要的音乐？加作者 wx 帮你下载：<span>bcc1324657</span></div>
        </aside>

        <!-- 中间分隔 -->
        <div class="divider"></div>

        <!-- 右侧：歌单制作区 -->
        <main class="panel panel-playlist" id="panelPlaylist">
            <div class="panel-header">
                <h2><span class="section-index">02</span>歌单编排</h2>
                <div class="playlist-actions">
                    <span class="song-count" id="playlistCount">0 首</span>
                    <span class="song-count" id="playlistTotalDuration" title="总时长">0:00</span>
                    <button class="btn btn-small btn-danger" id="btnClearPlaylist" title="清空歌单">
                        清空
                    </button>
                </div>
            </div>

            <!-- 歌单名称 -->
            <div class="playlist-name-row">
                <label for="playlistName">歌单名称</label>
                <input type="text" id="playlistName" placeholder="输入歌单名称..." value="婚礼歌单">
            </div>

            <!-- 歌单歌曲列表 -->
            <div class="song-list playlist-list" id="playlistList">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p>歌单还是空的</p>
                    <p class="empty-hint">从左侧音乐库点击 <strong>+</strong> 添加歌曲</p>
                </div>
            </div>

            <!-- 歌单操作 -->
            <div class="playlist-footer">
                <button class="btn btn-primary" id="btnSavePlaylist">保存歌单</button>
                <button class="btn btn-outline" id="btnLoadPlaylist">加载歌单</button>
                <button class="btn btn-outline" id="btnExportPlaylist" title="导出歌单信息 JSON">导出信息</button>
                <select id="savedPlaylists" class="saved-select" aria-label="选择已保存的歌单">
                    <option value="">已保存的歌单</option>
                </select>
                <button class="btn btn-small btn-danger" id="btnDeleteSaved" title="删除选中的歌单" aria-label="删除选中的歌单">×</button>
            </div>
        </main>
    </div>

    <!-- 移动端底部 Tab 栏（仅手机显示） -->
    <nav class="mobile-tabs" id="mobileTabs">
        <button class="mobile-tab active" data-panel="panelLibrary" type="button">
            <span class="mobile-tab-icon">📚</span>
            <span class="mobile-tab-label">音乐库</span>
        </button>
        <button class="mobile-tab" data-panel="panelPlaylist" type="button">
            <span class="mobile-tab-icon">🛠️</span>
            <span class="mobile-tab-label">工作区<span class="mobile-tab-badge" id="mobileWsBadge" hidden>0</span></span>
        </button>
    </nav>

    <!-- 音乐播放器（底部迷你栏） -->
    <div class="mini-player" id="miniPlayer" style="display:none;">
        <div class="player-info">
            <div class="player-cover" id="playerCover">🎵</div>
            <div class="player-meta">
                <span class="player-title" id="playerTitle">-</span>
                <span class="player-artist" id="playerArtist">-</span>
            </div>
        </div>
        <div class="player-controls">
            <button class="btn-icon" id="btnPrev" title="上一首">⏮️</button>
            <button class="btn-icon btn-play" id="btnPlay" title="播放/暂停">▶️</button>
            <button class="btn-icon" id="btnNext" title="下一首">⏭️</button>
        </div>
        <div class="player-progress">
            <input type="range" id="progressBar" min="0" max="100" value="0">
            <span class="player-time" id="playerTime">0:00 / 0:00</span>
        </div>
        <div class="player-volume">
            <span>🔊</span>
            <input type="range" id="volumeBar" min="0" max="100" value="70">
        </div>
    </div>

    <!-- 网页宠物：透明角色立绘 -->
    <div class="web-pet-portrait" id="webPetPortrait" aria-label="网页宠物">
        <button class="web-pet-portrait-close" id="webPetPortraitClose" type="button" aria-label="关闭网页宠物" title="关闭">×</button>
        <div class="web-pet-portrait-stage">
            <img src="images/web-pet-fullbody-v1.png" alt="婚礼音乐库网页宠物">
            <span class="web-pet-lid web-pet-lid-left"></span>
            <span class="web-pet-lid web-pet-lid-right"></span>
        </div>
        <span class="web-pet-portrait-hint">拖动我</span>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <!-- 音频加载进度条 -->
    <div class="load-progress" id="loadProgress" style="display:none;">
        <div class="load-progress-head">
            <span class="load-progress-title" id="loadProgressTitle">正在加载...</span>
            <span class="load-progress-pct" id="loadProgressPct">0%</span>
        </div>
        <div class="load-progress-track">
            <div class="load-progress-fill" id="loadProgressFill"></div>
        </div>
    </div>

    <!-- 音频剪辑器模态框 -->
    <div class="modal-overlay" id="editorOverlay" style="display:none;">
        <div class="modal editor-modal" id="audioEditorModal" style="display:none;">
            <button class="modal-close" id="editorClose">✕</button>
            <div class="editor-header">
                <h2>✂️ 音频剪辑器</h2>
                <span class="editor-subtitle" id="editorOriginalName">-</span>
            </div>
            <div class="editor-body">
                <div class="editor-row">
                    <label>剪辑名称：</label>
                    <input type="text" id="editorNewName" placeholder="输入剪辑后的名称...">
                </div>
                <div class="editor-row">
                    <label>原始时长：</label>
                    <span id="editorDuration">--:--</span>
                </div>

                <!-- 波形图画布 -->
                <div class="waveform-container">
                    <canvas id="editorCanvas"></canvas>
                </div>

                <!-- 时间控制 -->
                <div class="editor-time-controls">
                    <div class="time-input-group">
                        <label>开始时间</label>
                        <input type="text" id="editorTrimStart" value="0:00">
                    </div>
                    <div class="time-input-group">
                        <label>结束时间</label>
                        <input type="text" id="editorTrimEnd" value="0:00">
                    </div>
                    <div class="time-input-group">
                        <label>剪辑时长</label>
                        <span id="editorClipDuration">0:00</span>
                    </div>
                    <button class="btn btn-small btn-outline" id="btnEditorApplyTime">应用</button>
                </div>

                <!-- 操作按钮 -->
                <div class="editor-actions">
                    <button class="btn btn-outline" id="btnEditorPlay">▶ 预览剪辑</button>
                    <button class="btn btn-primary" id="btnEditorSave">💾 保存到音乐库</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/data.js?v=2"></script>
    <script src="js/app.js?v=20260920-ivory"></script>
    <script src="js/web-pet-portrait.js?v=7"></script>
